services:
  - type: web
    name: blogapp-api
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_CLOUD_URL
        fromService:
          name: blogapp-redis
          type: redis
          property: connectionString
      # Set this to your frontend URL(s), comma-separated
      # Example: https://myapp.onrender.com,https://www.myapp.com
      - key: CORS_ORIGIN
        value: ""
      # Email Configuration - ADD THESE in Render Dashboard
      - key: BREVO_SMTP_KEY
        sync: false # Set this in Render Dashboard as a secret
      - key: BREVO_SMTP_USER
        value: "9e331c001@smtp-brevo.com"
      - key: SENDER_EMAIL
        value: "siddheshbagde456@gmail.com"
      # Base URL for login links - set to your deployed backend URL
      - key: BASE_URL
        value: "" # e.g., https://blogapp-api.onrender.com
      # Or set FRONTEND_URL if login happens on frontend
      - key: FRONTEND_URL
        value: "" # e.g., https://myapp.onrender.com

  - type: redis
    name: blogapp-redis
    ipAllowList: []
